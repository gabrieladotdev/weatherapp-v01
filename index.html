<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Weather App Version 01</title>
  </head>
  <body>
    <div class="container">
      <div class="search">
        <input class="search-input" type="text" placeholder="Enter City Name" spellcheck="false" />
        <button>
          <img src="assets/images/search.png" alt="search button" />
        </button>
      </div>
      <div class="error">
        <p>Invalid city name</p>
      </div>
      <div class="weather">
        <img src="assets/images/rain.png" class="weather-icon" />
        <h1 class="temp">22°c</h1>
        <h2 class="city">New York</h2>
        <div class="details">
          <div class="col">
          <img src="assets/images/humidity.png">
          </div>
            <div>
            <p class="humidity">50%</p>
            <p>Humidity</p>
            </div>
          <div class="col">
          <img src="assets/images/wind.png">
          </div>
            <div>
            <p class="wind">15 km/h</p>
            <p>Wind speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>


   <script src="script.js"></script> 
  </body>
</html>
